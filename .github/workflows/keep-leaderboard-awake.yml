name: Keep the leaderboard awake

# Free Supabase projects pause after 7 days without activity. This reads the
# leaderboard once every 3 days so it stays up even when nobody is playing.
# It does nothing until config.js has the Supabase URL and publishable key.

on:
  schedule:
    - cron: "23 16 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the leaderboard once
        run: |
          url=$(sed -n "s/.*supabaseUrl: *'\([^']*\)'.*/\1/p" config.js)
          key=$(sed -n "s/.*supabaseKey: *'\([^']*\)'.*/\1/p" config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "The leaderboard isn't configured in config.js yet; nothing to do."
            exit 0
          fi
          auth=()
          case "$key" in eyJ*) auth=(-H "Authorization: Bearer $key") ;; esac
          curl -fsS "${url%/}/rest/v1/leaderboard?select=score_ms&limit=1" -H "apikey: $key" "${auth[@]}" -o /dev/null
          echo "The leaderboard answered."
